name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify backend and frontend
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q backend tests
          node --check frontend/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static frontend
        env:
          API_URL: ${{ vars.SURF_CHECK_API_URL }}
        run: |
          mkdir -p _site
          cp -R frontend/. _site/
          python -c 'import json, os; from urllib.parse import urlsplit; url = os.environ["API_URL"].strip(); parsed = urlsplit(url); assert parsed.scheme == "https" and parsed.netloc, "Set the SURF_CHECK_API_URL repository variable to the HTTPS backend URL"; open("_site/config.js", "w", encoding="utf-8").write("window.SURF_CHECK_API_BASE = " + json.dumps(url) + ";\n")'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
